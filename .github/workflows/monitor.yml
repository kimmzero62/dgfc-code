name: macro-monitor

on:
  schedule:
    # GitHub cron 은 UTC 기준이다. 한국 시간(KST) = UTC + 9시간.
    # GitHub 스케줄은 시각을 보장하지 않고, 정각·30분에는 특히 크게 밀리거나 빠진다.
    # 그래서 혼잡한 분을 피하고 같은 시간대에 예비 실행을 두 번 더 둔다.
    # 앞선 실행이 그 슬롯(아침/저녁)을 이미 끝냈으면 예비 실행은 gate 단계에서 바로 끝난다.
    #
    # 아침 슬롯 (월~금 KST = 전날 일~목 UTC)
    - cron: "7 22 * * 0-4"    # 07:07 KST = 22:07 UTC 전날
    - cron: "37 22 * * 0-4"   # 07:37 KST = 22:37 UTC 전날 (예비)
    - cron: "17 23 * * 0-4"   # 08:17 KST = 23:17 UTC 전날 (예비)
    # 저녁 슬롯 (월~금 KST = 같은 날 월~금 UTC)
    - cron: "47 7 * * 1-5"    # 16:47 KST = 07:47 UTC
    - cron: "17 8 * * 1-5"    # 17:17 KST = 08:17 UTC (예비)
    - cron: "57 8 * * 1-5"    # 17:57 KST = 08:57 UTC (예비)
  # 수동 실행. main 이 아닌 브랜치에서 돌리면 시험 실행만 한다 (커밋·게시·알림 없음, 결과물은 Artifact)
  workflow_dispatch:
    inputs:
      telegram_test:
        description: "텔레그램 연결 테스트 메시지 보내기"
        type: boolean
        default: false

permissions:
  contents: write   # data/macro.db 커밋
  issues: write     # 플래그 알림 이슈
  pages: write
  id-token: write

concurrency:
  group: macro-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 이미 끝난 슬롯이면 예비 스케줄 실행을 건너뛴다 (수동 실행은 항상 진행)
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}   # 이벤트 시점이 아닌 최신 커밋 (직전 실행의 DB 반영)
      - id: check
        run: python3 -m macro_monitor.slot check --event "${{ github.event_name }}"

  run:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IS_MAIN: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    outputs:
      rc: ${{ steps.monitor.outputs.rc }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}   # 최신 커밋에서 시작해야 DB 커밋 push 가 충돌하지 않는다

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 테스트
        run: python -m pytest -q

      - name: 텔레그램 연결 테스트
        if: inputs.telegram_test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m macro_monitor.main --telegram-test || echo "::warning::텔레그램 테스트 실패 (로그 확인)"

      - name: 수집 · 감지 · 리포트 · 알림
        id: monitor
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          if [ "$IS_MAIN" = "true" ]; then
            python -m macro_monitor.main --out site
          else
            python -m macro_monitor.main --out site --no-notify
          fi
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: DB 커밋 (다음 실행이 이어받음)
        if: env.IS_MAIN == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/macro.db
          if ! git diff --cached --quiet; then
            git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST 수집"
            git push
          fi

      - name: Pages 결과물 업로드
        if: env.IS_MAIN == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: 시험 실행 결과물 업로드
        if: env.IS_MAIN != 'true'
        uses: actions/upload-artifact@v5
        with:
          name: preview
          path: |
            site
            data/macro.db

  deploy:
    needs: run
    if: needs.run.result == 'success' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 전체 수집이 실패했을 때만 워크플로를 실패로 표시한다 (일부 실패는 페이지에 오류로 표시)
  result:
    needs: [gate, run, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: needs.gate.outputs.skip == 'true'
        run: echo "이미 끝난 슬롯이라 건너뜀"
      - if: needs.gate.outputs.skip != 'true'
        run: |
          echo "monitor exit code: ${{ needs.run.outputs.rc }}"
          test "${{ needs.run.result }}" = "success"
          test "${{ needs.run.outputs.rc }}" = "0"
