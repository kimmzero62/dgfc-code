name: verify-sources

# 데이터 소스 검증용. 이 브랜치에 검증 스크립트를 푸시하거나 수동으로 실행할 때 돈다.
on:
  workflow_dispatch:
  push:
    branches: [claude/epic-pascal-xal94a]
    paths:
      - scripts/verify_sources.py
      - .github/workflows/verify-sources.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests yfinance pykrx xlrd openpyxl lxml tabulate
      - run: python -u scripts/verify_sources.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
