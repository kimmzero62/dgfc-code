  - {id: us10y2y, name: 미국채 10Y-2Y 스프레드, group: 미국 금리·커브, source: fred, params: {series: T10Y2Y}, unit: "%p", change: bp, freq: daily, decimals: 2}
  - {id: acm_tp10, name: 미국 10년물 텀프리미엄 (ACM), group: 미국 금리·커브, source: acm, params: {column: ACMTP10}, unit: "%", change: bp, freq: daily, decimals: 3}
  - {id: us10y_real, name: 미국 10년물 실질금리, group: 미국 금리·커브, source: fred, params: {series: DFII10}, unit: "%", change: bp, freq: daily, decimals: 2}
