# 매크로 모니터 설정 파일
#
# defaults: 모든 지표에 공통으로 쓰는 감지 기준값
# indicators[].thresholds: 지표별로 기준을 바꾸고 싶을 때만 적는다 (defaults를 덮어씀)
#
# 지표 항목 설명
#   id          내부 식별자 (DB 키, 바꾸면 이력이 끊김)
#   name        화면 표시 이름
#   group       표의 분류
#   source      수집기 이름 (macro_monitor/sources/ 참고)
#   params      수집기에 넘기는 값
#   unit        값의 단위 표시
#   change      변화량 표시 방식: bp (금리·스프레드, %→bp 환산), pct (가격, 변화율 %), abs (값 그대로)
#   freq        daily | weekly — 지연 여부 판단에만 쓴다
#   decimals    표시 소수점 자리

defaults:
  z_threshold: 2.0            # |1년 z-score| 가 이 값 이상이면 플래그
  change_z_threshold: 2.0     # 일간·5일 변화가 과거 1년 변화 분포 대비 |z| 이 값 이상이면 플래그
  flag_new_high_low: true     # 1년 고점·저점 갱신 시 플래그
  lookback_days: 365          # z-score·백분위·고저 계산 창 (달력일)
  min_history_days: 180       # 이 기간보다 이력이 짧으면 감지하지 않고 '데이터 부족' 표시
  min_observations: 20        # 창 안 관측치가 이보다 적으면 '데이터 부족'
  stale_days:                 # 마지막 관측일이 이 일수보다 오래되면 '지연' 표시 (플래그 아님)
    daily: 5
    weekly: 12

backfill_days: 800            # 첫 실행 때 받아올 과거 기간
refresh_days: 45              # 이후 실행마다 다시 받아 덮어쓸 최근 기간 (수정치 반영)

alerts:
  github_issue: true          # 플래그가 새로 생기면 저장소에 이슈 생성 (GitHub 앱/메일 알림)
  issue_label: macro-flag
  mention: kimmzero62         # 이슈 본문에서 멘션할 GitHub 계정 (알림 보장용, 비우면 생략)
  telegram: auto              # TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID 시크릿이 있으면 전송
  telegram_summary: true      # true: 매 실행마다 요약 전송 (새 플래그 없어도), false: 새 플래그가 있을 때만

