<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>패밀리넷 신청 도우미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+Sinhala:wght@400;500;700&display=swap">
<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0;-webkit-text-size-adjust:100%}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* 배치: 휴대폰 한 손 화면 기준 — 위 머리띠(언어 선택), 가운데 대화, 아래 고정 입력줄 */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --ink:#1C2321; --muted:#5E6966;
  --line:#D9DFDC; --accent:#2E5B55; --accent-soft:#E3ECEA; --user:#2E5B55; --user-ink:#FFFFFF;
  --font-display:"Gowun Dodum","Noto Sans KR",system-ui,sans-serif;
  --font-body:"Noto Sans","Noto Sans KR","Noto Sans Sinhala","Apple SD Gothic Neo","Malgun Gothic","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --surface:#1E2523; --ink:#E7ECEA; --muted:#9AA6A2;
  --line:#33403C; --accent:#8CC2B8; --accent-soft:#25332F; --user:#3E7068; --user-ink:#F2F7F5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --surface:#1E2523; --ink:#E7ECEA; --muted:#9AA6A2;
  --line:#33403C; --accent:#8CC2B8; --accent-soft:#25332F; --user:#3E7068; --user-ink:#F2F7F5; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;display:flex;flex-direction:column}
.wrap{width:100%;max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line);z-index:2}
header .top{padding-block:12px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{min-width:0}
.brand small{display:block;color:var(--muted);font-size:12px;letter-spacing:.04em}
.brand h1{margin:0;font-family:var(--font-display);font-size:21px;font-weight:400;text-wrap:balance}
.brand .sub{display:block;font-size:13px;color:var(--muted)}
.restart{font:inherit;font-size:14px;background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;white-space:nowrap}
.restart:hover{border-color:var(--accent)}
.langs{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:10px}
.langs button{font:inherit;font-size:14px;flex:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:500}
main{flex:1;overflow-y:auto}
#log{display:flex;flex-direction:column;gap:14px;padding-block:20px 28px}
.msg{max-width:88%;min-width:0;padding:12px 16px;border-radius:16px;word-break:keep-all;overflow-wrap:anywhere}
.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-top-left-radius:4px}
.me{align-self:flex-end;background:var(--user);color:var(--user-ink);border-top-right-radius:4px}
.bot p{margin:0 0 8px}.bot p:last-child{margin-bottom:0}
.bot ol,.bot ul{margin:6px 0 8px;padding-left:22px}
.bot li{margin:4px 0}
.path{display:inline;background:var(--accent-soft);color:var(--accent);font-weight:500;padding:1px 7px;border-radius:6px;font-size:15px;font-family:"Noto Sans KR",var(--font-body)}
.say{font-weight:700}
.note{color:var(--muted);font-size:14px}
.choices{display:flex;flex-direction:column;gap:8px;align-self:stretch;padding-left:4px}
.choices button{font:inherit;text-align:left;background:var(--surface);color:var(--accent);border:1.5px solid var(--accent);border-radius:12px;padding:11px 14px;cursor:pointer;line-height:1.45}
.choices button:hover{background:var(--accent-soft)}
.choices button.home{color:var(--muted);border-color:var(--line);border-width:1px}
.choices button:focus-visible,.restart:focus-visible,.langs button:focus-visible,#q:focus-visible,#send:focus-visible,.copy:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.choices button:disabled{opacity:.45;cursor:default;background:var(--surface)}
.call{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:8px}
.tel{font-family:var(--font-display);font-size:24px;letter-spacing:.02em;user-select:all;font-variant-numeric:tabular-nums}
.copy{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer}
a{color:var(--accent)}
footer{border-top:1px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
footer form{display:flex;gap:8px;padding-block:10px}
#q{flex:1;min-width:0;font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 12px}
#send{font:inherit;background:var(--accent);color:var(--surface);border:none;border-radius:12px;padding:0 16px;cursor:pointer}
@media (prefers-reduced-motion: no-preference){.msg,.choices{animation:rise .22s ease-out}}
@keyframes rise{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
</style>

<header><div class="wrap">
  <div class="top">
    <div class="brand"><small id="org">울산동구가족센터</small><h1>패밀리넷 신청 도우미</h1><span class="sub" id="sub" hidden></span></div>
    <button class="restart" id="restart" type="button">처음으로</button>
  </div>
  <div class="langs" id="langs" hidden></div>
</div></header>

<main id="scroller"><div class="wrap"><div id="log" aria-live="polite"></div></div></main>

<footer id="foot"><div class="wrap">
  <form id="ask" autocomplete="off">
    <input id="q" type="text" placeholder="막힌 부분을 짧게 적어 보세요 (예: 가족이 안 보여요)" aria-label="질문 입력">
    <button id="send" type="submit">보내기</button>
  </form>
</div></footer>

<script>
const TEL = "052-232-3357";
const LINKS = { VIDEO:"https://youtu.be/V2rTuzzRM54", HOME:"https://dongguulsan.familynet.or.kr/center/" };

/* 흐름: 어느 칸에서 어느 칸으로 가는지. 문구는 lang 폴더의 언어별 .txt 파일에 있음 */
const FLOW = {
  start:{to:["guide","fam","target","wait","already","check","wrong","login","cancel"]},
  guide:{to:["login","famAdd"],end:1},
  fam:{to:["famAdd","famSearch","famSaved","famAdd"]},
  famAdd:{to:["famSearch"],end:1},
  famSearch:{to:["famJoin","famCheck"]},
  famJoin:{to:[],end:1}, famCheck:{to:[],end:1}, famSaved:{to:[],end:1},
  target:{to:[],end:1}, wait:{to:[],end:1},
  already:{to:["cancel"],end:1}, check:{to:["wrong"],end:1}, wrong:{to:["fam"],end:1},
  login:{to:["signup","loginFail"]}, signup:{to:["famAdd"],end:1},
  loginFail:{to:[],end:1,self:1}, cancel:{to:[],end:1},
  contact:{to:["start"]}, done:{to:["start"]}
};
const LANGS = [["ko","한국어"]];   /* 한국어 전용 — 번역 검수가 끝나면 다국어 버전(familynet_guide)으로 바꿀 것 */

/* ── 스크립트 파일 읽기 ── */
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function inline(t){
  let h = esc(t);
  h = h.replace(/&lt;&lt;(.+?)\|(\w+)&gt;&gt;/g,(m,txt,key)=> LINKS[key] ? `<a href="${LINKS[key]}" target="_blank" rel="noopener">${txt}</a>` : txt);
  h = h.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  h = h.replace(/\[([^\]]+)\]/g,'<span class="path" lang="ko">$1</span>');
  h = h.replace(/\{([^}]+)\}/g,'<b lang="ko">$1</b>');
  return h;
}
function parse(text){
  const out = {ui:{}}; let id = null, sec = null, list = null;
  const close = () => { if(list){ sec.html += `</${list}>`; list = null; } };
  for(const raw of text.replace(/^﻿/,"").split(/\r?\n/)){
    const line = raw.trim();
    const head = line.match(/^===\s*(\S+)\s*===$/);
    if(head){ if(sec) close(); id = head[1]; sec = id==="ui" ? null : (out[id] = {html:"", c:[]}); continue; }
    if(!line || line.startsWith("#") || !id) continue;
    if(id === "ui"){ const m = line.match(/^(\w+)\s*=\s*(.*)$/); if(m) out.ui[m[1]] = m[2]; continue; }
    let m;
    if(line.startsWith(">")){ close(); sec.c.push(line.slice(1).trim()); continue; }
    if(line === "@전화"){ close(); sec.html += `<div class="call"><span class="tel">${TEL}</span><button class="copy" type="button" data-copy></button></div>`; continue; }
    if((m = line.match(/^\d+[.)]\s+(.*)$/))){ if(list!=="ol"){ close(); sec.html += "<ol>"; list="ol"; } sec.html += `<li>${inline(m[1])}</li>`; continue; }
    if((m = line.match(/^[-•]\s+(.*)$/))){ if(list!=="ul"){ close(); sec.html += "<ul>"; list="ul"; } sec.html += `<li>${inline(m[1])}</li>`; continue; }
    close();
    if(line.startsWith("!")) sec.html += `<p class="say">${inline(line.slice(1).trim())}</p>`;
    else if(line.startsWith("~")) sec.html += `<p class="note">${inline(line.slice(1).trim())}</p>`;
    else sec.html += `<p>${inline(line)}</p>`;
  }
  if(sec) close();
  return out;
}
const CACHE = {};
async function load(l){
  if(CACHE[l]) return CACHE[l];
  const r = await fetch(`lang/${l}.txt`, {cache:"no-cache"});
  if(!r.ok) throw new Error(r.status);
  return CACHE[l] = parse(await r.text());
}

/* 한국어 입력창 단어 → 칸 */
const KEYS = [
 [/문자|취소\s*(됐|되었|됨)/,"wrong"],
 [/대상자|대상이 아|대상 아/,"target"],[/대기/,"wait"],[/이미/,"already"],[/취소/,"cancel"],
 [/로그인|아이디|비밀번호|비번/,"login"],[/가입/,"signup"],
 [/가족.*(안|없|못)|안\s*보|안\s*떠|안\s*나와|추가/,"fam"],
 [/잘못|혼자|나만|대표만|다시 신청|연락/,"wrong"],[/확인|됐는지|되었는지|신청됐/,"check"],
 [/처음|방법|어떻게/,"guide"],[/전화|번호|문의|상담/,"contact"]
];

const log = document.getElementById("log");
const scroller = document.getElementById("scroller");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let lang = "ko";
/* 번역 파일에 칸이나 버튼이 빠져 있으면 한국어로 채움 */
const sec = id => (CACHE[lang] && CACHE[lang][id]) || CACHE.ko[id];
const ui = k => (CACHE[lang] && CACHE[lang].ui[k]) || CACHE.ko.ui[k] || "";

function scrollDown(){ scroller.scrollTo({top:scroller.scrollHeight, behavior: reduce ? "auto" : "smooth"}); }
function disableOld(){ log.querySelectorAll(".choices button").forEach(b=>b.disabled=true); }
function addMe(text){ const d=document.createElement("div"); d.className="msg me"; d.textContent=text; log.appendChild(d); }

function show(id){
  const f=FLOW[id], t=sec(id); if(!f||!t) return;
  const b=document.createElement("div"); b.className="msg bot"; b.innerHTML=t.html; log.appendChild(b);
  b.querySelectorAll("[data-copy]").forEach(x=>x.textContent=ui("copy"));
  const ko=CACHE.ko[id].c;
  let opts=f.to.map((to,i)=>[t.c[i]||ko[i],to]);
  if(f.end) opts=opts.concat(f.self ? [[ui("ok"),"done"],[ui("back"),"start"]] : [[ui("ok"),"done"],[ui("no"),"contact"]]);
  /* 첫 화면이 아니면 선택지 맨 끝에 항상 [처음으로] */
  if(id!=="start" && !opts.some(o=>o[1]==="start")) opts.push([ui("restart"),"start"]);
  if(opts.length){
    const c=document.createElement("div"); c.className="choices";
    opts.forEach(([label,to])=>{
      const btn=document.createElement("button"); btn.type="button"; btn.textContent=label;
      if(to==="start") btn.className="home";
      btn.addEventListener("click",()=>{ disableOld(); addMe(label); setTimeout(()=>{show(to);scrollDown();}, reduce?0:260); });
      c.appendChild(btn);
    });
    log.appendChild(c);
  }
  scrollDown();
}

async function setLang(l){
  if(!LANGS.some(([c])=>c===l)) l="ko";
  try{ await load("ko"); if(l!=="ko") await load(l); }
  catch(e){
    if(l!=="ko"){ return setLang("ko"); }
    log.innerHTML='<div class="msg bot"><p>안내 문구 파일(lang 폴더)을 불러오지 못했어요. index.html과 lang 폴더가 같은 곳에 있는지 확인해 주세요.</p></div>';
    return;
  }
  lang=l;
  document.documentElement.lang = l==="zh" ? "zh-CN" : l;
  document.getElementById("org").textContent=ui("org");
  const sub=document.getElementById("sub"); sub.textContent=ui("sub"); sub.hidden=!ui("sub");
  document.getElementById("restart").textContent=ui("restart");
  document.getElementById("foot").hidden = l!=="ko";
  document.querySelectorAll("#langs button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.l===l ? "true":"false"));
  try{ localStorage.setItem("fn_lang", l); }catch(_){}
  log.innerHTML=""; if(JUMP){ show(JUMP); JUMP=null; } else show("start");
}

const langBox=document.getElementById("langs");
LANGS.forEach(([code,name])=>{
  const b=document.createElement("button"); b.type="button"; b.dataset.l=code; b.textContent=name;
  b.lang = code==="zh" ? "zh-CN" : code;
  b.addEventListener("click",()=>setLang(code)); langBox.appendChild(b);
});

log.addEventListener("click",e=>{
  const btn=e.target.closest("[data-copy]"); if(!btn) return;
  const tel=btn.parentElement.querySelector(".tel");
  const fallback=()=>{ const r=document.createRange(); r.selectNodeContents(tel); const s=getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent=ui("copyFb"); };
  try{ navigator.clipboard.writeText(TEL).then(()=>{btn.textContent=ui("copied");setTimeout(()=>btn.textContent=ui("copy"),1600);},fallback); }catch(_){ fallback(); }
});

document.getElementById("ask").addEventListener("submit",e=>{
  e.preventDefault();
  const q=document.getElementById("q"); const t=q.value.trim(); if(!t) return;
  q.value=""; disableOld(); addMe(t);
  const hit=KEYS.find(([re])=>re.test(t));
  setTimeout(()=>{
    if(hit){ show(hit[1]); }
    else{
      const b=document.createElement("div"); b.className="msg bot";
      b.innerHTML="<p>제가 정확히 알아듣지 못했어요. 아래에서 가장 가까운 상황을 골라 주세요.</p>";
      log.appendChild(b); show("start");
    }
    scrollDown();
  }, reduce?0:260);
});

document.getElementById("restart").addEventListener("click",()=>{ log.innerHTML=""; show("start"); });

/* 주소 끝 #retry → 취소 문자 받은 분 안내로 바로 연다 */
let JUMP = {retry:"wrong"}[(location.hash||"").replace("#","")] || null;

/* 시작 언어: 주소 끝 #vi 같은 표시 > 지난번 선택 > 휴대폰 언어 > 한국어 */
const has = c => LANGS.some(([x])=>x===c);
let first=(location.hash||"").replace("#","");
if(!has(first)){ try{ first=localStorage.getItem("fn_lang")||""; }catch(_){ first=""; } }
if(!has(first)){ const nav=(navigator.language||"ko").slice(0,2); first = has(nav) ? nav : "ko"; }
setLang(first);
</script>
</body>
</html>
